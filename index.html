
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My First Website</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f0f4f8;
      color: #222;
      text-align: center;
    }
    header {
      background: #123c69;
      color: white;
      padding: 25px 10px;
    }
    main {
      padding: 45px 20px;
    }
    .card {
      background: white;
      padding: 25px;
      border-radius: 15px;
      max-width: 400px;
      margin: auto;
      box-shadow: 0 4px 12px #cccccc;
    }
    a {
      display: inline-block;
      background: #16834a;
      color: white;
      padding: 12px 20px;
      text-decoration: none;
      border-radius: 8px;
    }
  </style>
</head>
<body>
  <header>
    <h1>My First Website</h1>
    <p>Welcome to my online business</p>
  </header>
  <main>
    <div class="card">
      <h2>Welcome!</h2>
      <p>This is my first website.</p>
      <a href="mailto:your@email.com">Contact Us</a>
    </div>
  </main>
</body>
</html>
